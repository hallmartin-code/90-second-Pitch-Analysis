<div
  id="job-progress"
  {% if in_progress %}hx-get="/status/{{ job_id }}" hx-trigger="every 2s" hx-swap="outerHTML"{% endif %}
  class="rounded-xl border border-stone-200 bg-stone-50 p-6 text-center"
>
  <div class="flex items-center justify-center gap-3">
    <svg class="h-5 w-5 animate-spin text-accent" viewBox="0 0 24 24" fill="none">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
    </svg>
    <span class="font-medium text-stone-700">{{ label }}</span>
  </div>
  {% if page_total %}
  <p class="mt-2 text-sm text-stone-400">{{ page_total }} slide{{ "s" if page_total != 1 }}</p>
  {% endif %}
</div>
