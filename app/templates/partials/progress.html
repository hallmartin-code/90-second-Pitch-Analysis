<div
  id="job-progress"
  class="panel"
  {% if in_progress %}hx-get="/status/{{ job_id }}" hx-trigger="every 2s" hx-swap="outerHTML"{% endif %}
>
  <div class="row">
    <div class="spinner"></div>
    <div class="stage-label">{{ label }}</div>
  </div>
  {% if page_total %}
  <div class="muted">{{ page_total }} slide{{ "s" if page_total != 1 }} &middot; reading with vision</div>
  {% endif %}
</div>
