<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}90 Second Pitch Analysis{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { accent: "#1f5f5b" },
          fontFamily: {
            serif: ["Georgia", "Cambria", "serif"],
            sans: ["ui-sans-serif", "system-ui", "Segoe UI", "sans-serif"],
          },
        },
      },
    };
  </script>
</head>
<body class="h-full bg-stone-50 text-stone-800 font-sans antialiased">
  <div class="min-h-full flex flex-col">
    <header class="border-b border-stone-200 bg-white">
      <div class="mx-auto max-w-3xl px-6 py-4 flex items-center justify-between">
        <a href="/" class="font-serif text-lg font-semibold text-stone-900">
          90&nbsp;Second Pitch Analysis
        </a>
        <span class="text-xs uppercase tracking-widest text-accent">Beta</span>
      </div>
    </header>

    <main class="flex-1">
      <div class="mx-auto max-w-3xl px-6 py-12">
        {% block content %}{% endblock %}
      </div>
    </main>

    <footer class="border-t border-stone-200 bg-white">
      <div class="mx-auto max-w-3xl px-6 py-4 text-xs text-stone-400">
        For a founder preparing an investor meeting. Reports are generated by an AI evaluator.
      </div>
    </footer>
  </div>
</body>
</html>
