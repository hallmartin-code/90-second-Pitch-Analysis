<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}90 Second Pitch Analysis{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root{
      --navy-950:#0B1526; --navy-900:#101E33; --navy-800:#16283F; --navy-700:#1E354F;
      --coral:#EE5A4E; --coral-soft:#F0776C; --amber:#F3A22A; --teal:#35BEBB;
      --ink-100:#F3F6FA; --ink-300:#C4D0E0; --ink-500:#7E90A8; --ink-600:#5C6E86;
    }
    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; background:var(--navy-950); color:var(--ink-100);
      font-family:'Inter',sans-serif; min-height:100vh; }
    body{ position:relative; overflow-x:hidden; }
    body::before{ content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
      background:
        radial-gradient(480px 380px at 14% 6%, rgba(238,90,78,0.16), transparent 60%),
        radial-gradient(480px 380px at 86% 4%, rgba(243,162,42,0.13), transparent 60%),
        radial-gradient(620px 460px at 50% 108%, rgba(53,190,187,0.14), transparent 60%); }

    a{ color:var(--teal); text-decoration:none; }
    a:hover{ color:var(--ink-100); }

    .shell{ position:relative; z-index:1; width:100%; max-width:720px; margin:0 auto;
      padding:40px 20px 56px; }

    /* brand lockup */
    .brand{ display:flex; align-items:center; gap:12px; margin-bottom:26px; padding-left:2px; }
    .brand-mark{ width:34px; height:34px; flex-shrink:0; }
    .brand-word{ font-family:'Sora',sans-serif; font-weight:800; font-size:15px;
      letter-spacing:0.04em; line-height:1.15; text-transform:uppercase; color:var(--ink-100); }
    .brand-word span{ display:block; font-weight:600; font-size:10px; letter-spacing:0.22em;
      color:var(--ink-500); margin-top:2px; }

    /* card */
    .card{ background:linear-gradient(180deg,var(--navy-900) 0%,var(--navy-800) 100%);
      border:1px solid var(--navy-700); border-radius:20px; padding:40px 40px 32px;
      box-shadow:0 30px 60px -20px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.03);
      position:relative; overflow:hidden; }
    .card::after{ content:""; position:absolute; top:-2px; left:40px; right:40px; height:2px;
      border-radius:2px; background:linear-gradient(90deg,var(--coral),var(--amber),var(--teal)); }

    .eyebrow{ display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono',monospace;
      font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--teal);
      margin-bottom:14px; }
    .eyebrow::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--teal);
      box-shadow:0 0 0 3px rgba(53,190,187,0.18); }

    h1{ font-family:'Sora',sans-serif; font-size:28px; font-weight:700; line-height:1.25;
      margin:0 0 12px; letter-spacing:-0.01em; }
    h1 .arrow{ color:var(--ink-500); font-weight:400; margin:0 4px; }
    h1 .to{ background:linear-gradient(90deg,var(--coral-soft),var(--amber));
      -webkit-background-clip:text; background-clip:text; color:transparent; }

    .lede{ color:var(--ink-300); font-size:15px; line-height:1.6; margin:0 0 30px; max-width:48ch; }

    /* dropzone */
    .dropzone{ display:block; border:1.5px dashed var(--navy-700); border-radius:14px;
      padding:36px 24px; text-align:center; cursor:pointer; background:rgba(255,255,255,0.015);
      transition:border-color .18s ease, background .18s ease, transform .18s ease; }
    .dropzone:hover{ border-color:var(--teal); background:rgba(53,190,187,0.05); }
    .dropzone:active{ transform:scale(0.997); }
    .dropzone-icon{ width:38px; height:38px; margin:0 auto 14px; border-radius:10px;
      background:linear-gradient(135deg,rgba(238,90,78,0.16),rgba(243,162,42,0.16));
      border:1px solid var(--navy-700); display:flex; align-items:center; justify-content:center; }
    .dropzone-icon svg{ width:18px; height:18px; }
    .dropzone-title{ font-size:15px; font-weight:600; color:var(--ink-100); margin-bottom:6px;
      word-break:break-word; }
    .dropzone-sub{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-500); }
    .dropzone-sub b{ color:var(--ink-300); font-weight:500; }
    .file-input{ display:none; }

    /* CTA */
    .cta{ width:100%; margin-top:20px; padding:16px 20px; border:none; border-radius:12px;
      background:linear-gradient(90deg,var(--coral) 0%,var(--coral-soft) 45%,var(--amber) 100%);
      color:#17130E; font-family:'Sora',sans-serif; font-weight:700; font-size:15px;
      cursor:pointer; transition:filter .15s ease, transform .15s ease;
      box-shadow:0 10px 24px -10px rgba(238,90,78,0.45); }
    .cta:hover{ filter:brightness(1.06); transform:translateY(-1px); }
    .cta:active{ transform:translateY(0); }
    .cta:disabled{ filter:grayscale(0.4) brightness(0.8); cursor:not-allowed; transform:none; }
    .btn-ghost{ display:inline-block; padding:10px 18px; border-radius:10px;
      border:1px solid var(--navy-700); color:var(--ink-300); font-size:13px; font-weight:500; }
    .btn-ghost:hover{ border-color:var(--teal); color:var(--ink-100); }

    .disclosure{ margin-top:22px; padding-top:18px; border-top:1px solid var(--navy-700);
      font-size:12px; line-height:1.6; color:var(--ink-500); }

    /* progress + notices */
    .panel{ margin-top:22px; border:1px solid var(--navy-700); border-radius:14px;
      background:rgba(255,255,255,0.02); padding:22px 24px; }
    .row{ display:flex; align-items:center; gap:12px; }
    .spinner{ width:20px; height:20px; border-radius:50%; border:2.5px solid var(--navy-700);
      border-top-color:var(--teal); animation:spin .8s linear infinite; flex-shrink:0; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    .stage-label{ font-family:'Sora',sans-serif; font-weight:600; font-size:15px; color:var(--ink-100); }
    .muted{ color:var(--ink-500); font-size:12.5px; margin-top:8px; font-family:'JetBrains Mono',monospace; }

    /* report */
    .report-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
    .company{ font-family:'Sora',sans-serif; font-size:26px; font-weight:700; margin:0; }
    .subtle{ color:var(--ink-500); font-size:13px; margin-top:4px; font-family:'JetBrains Mono',monospace;
      letter-spacing:0.06em; text-transform:uppercase; }
    .score-hero{ text-align:right; flex-shrink:0; }
    .score-num{ font-family:'Sora',sans-serif; font-weight:800; font-size:52px; line-height:1;
      background:linear-gradient(90deg,var(--coral-soft),var(--amber)); -webkit-background-clip:text;
      background-clip:text; color:transparent; }
    .score-cap{ color:var(--ink-500); font-size:11px; font-family:'JetBrains Mono',monospace;
      text-transform:uppercase; letter-spacing:0.1em; margin-top:2px; }
    .assess{ color:var(--ink-300); font-size:14.5px; line-height:1.6; }
    .chips{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:22px 0; }
    .chip{ border:1px solid var(--navy-700); border-radius:12px; padding:14px 10px; text-align:center;
      background:rgba(255,255,255,0.015); }
    .chip-title{ font-size:11.5px; color:var(--ink-300); line-height:1.3; min-height:2.6em; }
    .chip-score{ font-family:'Sora',sans-serif; font-weight:700; font-size:20px; color:var(--teal); margin-top:6px; }
    .actions{ display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin:8px 0 4px; }
    .actions .cta{ width:auto; margin-top:0; }
    .preview{ width:100%; height:78vh; border:1px solid var(--navy-700); border-radius:14px;
      margin-top:12px; background:#fff; }

    .site-footer{ text-align:center; margin-top:26px; font-family:'JetBrains Mono',monospace;
      font-size:11px; letter-spacing:0.08em; color:var(--ink-600); text-transform:uppercase; }

    @media (max-width:560px){
      .card{ padding:30px 22px 26px; } h1{ font-size:22px; }
      .chips{ grid-template-columns:repeat(2,1fr); }
      .report-head{ flex-direction:column; } .score-hero{ text-align:left; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 6 C64 6 74 16 74 16" stroke="var(--amber)" stroke-width="11" stroke-linecap="round" fill="none"/>
        <path d="M76 66 C76 82 63 92 63 92" stroke="var(--teal)" stroke-width="11" stroke-linecap="round" fill="none"/>
        <path d="M24 66 C24 82 37 92 37 92" stroke="var(--coral)" stroke-width="11" stroke-linecap="round" fill="none" transform="rotate(180 50 79)"/>
        <circle cx="50" cy="20" r="11" fill="var(--amber)"/>
        <circle cx="78" cy="68" r="11" fill="var(--teal)"/>
        <circle cx="22" cy="68" r="11" fill="var(--coral)"/>
      </svg>
      <div class="brand-word">Ten Capital<span>Network</span></div>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">Powered by TEN Capital Network</footer>
  </div>
</body>
</html>
